# ============ PROD ============
build_custom_image_prod:
  stage: prepare
  resource_group: "vwa-congtacsinhvien-prod-runner-heavy"
  image:
    name: gcr.io/kaniko-project/executor:v1.23.0-debug
    entrypoint: [""]
  tags:
    - runner-vu-digital-prod
  variables:
    AWS_ACCOUNT_ID: "537557168856"
    ECR_REGISTRY: "537557168856.dkr.ecr.ap-southeast-1.amazonaws.com"
    KUBERNETES_MEMORY_REQUEST: "1Gi"
    KUBERNETES_MEMORY_LIMIT: "3Gi"
    KUBERNETES_CPU_REQUEST: "1"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_EPHEMERAL_STORAGE_REQUEST: "5Gi"
    KUBERNETES_EPHEMERAL_STORAGE_LIMIT: "10Gi"
  rules:
    - if: $CI_COMMIT_TAG =~ /^base_prod_.+/
  script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json << DOCKEREOF
      {
        "credHelpers": {
          "537557168856.dkr.ecr.ap-southeast-1.amazonaws.com": "ecr-login"
        }
      }
      DOCKEREOF
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/DockerfileBuildBase"
      --destination "537557168856.dkr.ecr.ap-southeast-1.amazonaws.com/vwa-congtacsinhvien:${PROD_BUILD_BASE_TAG}-${CI_COMMIT_TAG}"
      --destination "537557168856.dkr.ecr.ap-southeast-1.amazonaws.com/vwa-congtacsinhvien:${PROD_BUILD_BASE_TAG}"
      --cache=true
      --cache-repo="537557168856.dkr.ecr.ap-southeast-1.amazonaws.com/prod-build-cache"
      --snapshot-mode=redo
      --use-new-run
      --compressed-caching=false
      --cleanup
  interruptible: true

build_prod:
  stage: build
  resource_group: "vwa-congtacsinhvien-prod-runner-heavy"
  image:
    name: gcr.io/kaniko-project/executor:v1.23.0-debug
    entrypoint: [""]
  tags:
    - runner-vu-digital-prod
  variables:
    AWS_ACCOUNT_ID: "537557168856"
    ECR_REGISTRY: "537557168856.dkr.ecr.ap-southeast-1.amazonaws.com"
    KUBERNETES_MEMORY_REQUEST: "1Gi"
    KUBERNETES_MEMORY_LIMIT: "3Gi"
    KUBERNETES_CPU_REQUEST: "1"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_EPHEMERAL_STORAGE_REQUEST: "5Gi"
    KUBERNETES_EPHEMERAL_STORAGE_LIMIT: "10Gi"
  rules:
    - if: $CI_COMMIT_TAG =~ /^build_.+/
    - if: $CI_COMMIT_TAG =~ /^release_.+/
  script:
    - |
      MAIN_SHA="$(wget --header "JOB-TOKEN: ${CI_JOB_TOKEN}" -qO- "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/branches/main" | sed -n 's/.*"id":"\([0-9a-f]\{40\}\)".*/\1/p' | head -n 1)"
      if [ -z "${MAIN_SHA}" ]; then
        echo "Cannot resolve origin/main HEAD from GitLab API."
        exit 1
      fi
      if [ "${CI_COMMIT_SHA}" != "${MAIN_SHA}" ]; then
        echo "Skip prod build: tag ${CI_COMMIT_TAG} points to ${CI_COMMIT_SHA}, not origin/main (${MAIN_SHA})."
        exit 0
      fi
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json << DOCKEREOF
      {
        "credHelpers": {
          "537557168856.dkr.ecr.ap-southeast-1.amazonaws.com": "ecr-login"
        }
      }
      DOCKEREOF
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/DockerfileProd"
      --build-arg "BUILD_BASE_IMAGE=537557168856.dkr.ecr.ap-southeast-1.amazonaws.com/vwa-congtacsinhvien:${PROD_BUILD_BASE_TAG}"
      --destination "537557168856.dkr.ecr.ap-southeast-1.amazonaws.com/vwa-congtacsinhvien:${CI_COMMIT_TAG}"
      --destination "537557168856.dkr.ecr.ap-southeast-1.amazonaws.com/vwa-congtacsinhvien:latest"
      --cache=true
      --cache-repo="537557168856.dkr.ecr.ap-southeast-1.amazonaws.com/prod-build-cache"
      --snapshot-mode=redo
      --use-new-run
      --compressed-caching=false
      --cleanup
  interruptible: true

update_gitops_prod:
  extends: .update_image_tag_prod
  resource_group: "vwa-congtacsinhvien-prod-runner-heavy"
  variables:
    AWS_ACCOUNT_ID: "537557168856"
    ECR_REGISTRY: "537557168856.dkr.ecr.ap-southeast-1.amazonaws.com"
  needs:
    - build_prod
