stages:
  - sast_scan
  - sast_upload
  - sca_source
  - prepare
  - build
  - sca_image
  - update-gitops

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG =~ /^scan_.+/
    - if: $CI_COMMIT_TAG =~ /^build_base_(develop|prod).*/
    - if: $CI_COMMIT_TAG =~ /^release_.+/
    - when: never


variables:
  AWS_ACCOUNT_ID: "520492793952"
  AWS_REGION: "ap-southeast-1"
  ECR_REGISTRY: "520492793952.dkr.ecr.ap-southeast-1.amazonaws.com"
  ECR_REPO_NAME: "vwa-congtacsinhvien"
  APP_NAME: "dhs-ctsv-web"
  DEV_BUILD_BASE_TAG: "build-base-develop"
  DEV_BUILD_BASE_IMAGE: "${JFROG_REGISTRY}/${JFROG_IMAGE_REPO}/${APP_NAME}:${DEV_BUILD_BASE_TAG}"
  PROD_BUILD_BASE_TAG: "build-base-prod"
  PROD_BUILD_BASE_IMAGE: "${JFROG_REGISTRY}/${JFROG_IMAGE_REPO}/${APP_NAME}:${PROD_BUILD_BASE_TAG}"
  GIT_DEPTH: 1
  CICD_ENGAGEMENT_NAME: "CICD Runs - ${CI_COMMIT_REF_NAME}"

include:
  - project: 'vinsoc-ai/anbm-pentest/security-templates'
    ref: main
    file:
      - '/dojo-context.gitlab-ci.yml'
      - '/namespace-mirror.gitlab-ci.yml'
      - '/vuln-scan.gitlab-ci.yml'
      - '/sbom-scan.gitlab-ci.yml'
      - '/image-scan.gitlab-ci.yml'
  - project: 'vsf-qtvhgd/vinuni/digital-university/devsecops/gitops-dev'
    ref: master
    file:
      - '.gitlab/templates/jfrog-build.gitlab-ci.yml'
      - '.gitlab/cd-update-image.yml'
  - project: 'vsf-qtvhgd/vinuni/digital-university/devsecops/gitops-prod'
    ref: master
    file: '.gitlab/cd-update-image.yml'


build_develop:
  stage: build
  resource_group: "vwa-congtacsinhvien-dev-runner-heavy"
  image:
    name: gcr.io/kaniko-project/executor:v1.23.0-debug
    entrypoint: [""]
  tags:
    - runner-vu-digital-dev
  variables:
    KUBERNETES_MEMORY_REQUEST: "2Gi"
    KUBERNETES_MEMORY_LIMIT: "5Gi"
    KUBERNETES_CPU_REQUEST: "2"
    KUBERNETES_CPU_LIMIT: "4"
    KUBERNETES_EPHEMERAL_STORAGE_REQUEST: "10Gi"
    KUBERNETES_EPHEMERAL_STORAGE_LIMIT: "20Gi"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
  script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json << DOCKEREOF
      {
        "auths": {
          "${JFROG_REGISTRY}": {
            "username": "${JFROG_USER}",
            "password": "${JFROG_TOKEN}"
          }
        },
        "credHelpers": {
          "${ECR_REGISTRY}": "ecr-login"
        }
      }
      DOCKEREOF
    - |
      BUILD_BASE_IMAGE="${DEV_BUILD_BASE_IMAGE}"
      if ! wget -q --spider --user="${JFROG_USER}" --password="${JFROG_TOKEN}" "https://${JFROG_REGISTRY}/v2/${JFROG_IMAGE_REPO}/${APP_NAME}/manifests/${DEV_BUILD_BASE_TAG}"; then
        echo "Build-base image ${DEV_BUILD_BASE_IMAGE} not found. Falling back to node:22-alpine."
        BUILD_BASE_IMAGE="node:22-alpine"
      fi
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --build-arg "BUILD_BASE_IMAGE=${BUILD_BASE_IMAGE}"
      --destination "${ECR_REGISTRY}/vwa-congtacsinhvien:${CI_COMMIT_SHORT_SHA}"
      --destination "${ECR_REGISTRY}/vwa-congtacsinhvien:develop"
      --cache=true
      --cache-repo="${ECR_REGISTRY}/digital-dev-build-cache"
      --snapshot-mode=redo
      --use-new-run
      --compressed-caching=false
      --cleanup
  interruptible: true

jfrog_build_congtacsinhvien:
  extends: .jfrog_kaniko_build_job
  resource_group: "vwa-congtacsinhvien-dev-runner-heavy"
  tags:
    - vu-aund
  rules:
    - if: $CI_COMMIT_TAG =~ /^scan_.+/
  variables:
    BUILD_CONTEXT: "${CI_PROJECT_DIR}"
    BUILD_DOCKERFILE: "${CI_PROJECT_DIR}/Dockerfile"
    BUILD_DESTINATION: "${JFROG_REGISTRY}/${JFROG_IMAGE_REPO}/${APP_NAME}:${CI_COMMIT_SHORT_SHA}"

